# Glosario de terminología Naruto: japonés/inglés -> castellano de España
# Proyecto: Traducción Rebuild of Naruto
# Uso: referencia fija de terminología para el agente de traducción de subtítulos,
#      para no reinventar nombres de técnicas/vocabulario episodio a episodio.
#
# Prioridad de fuentes usada al investigar (de más a menos fiable):
#   1) naruto-official.com/es (sitio oficial)
#   2) Subtítulos en castellano de Espana verificados contra dialogo real del anime
#      (registro "vosotros" confirmado)
#      -> gana incluso a la guia/manga (Rebuild traduce el ANIME, no el manga)
#   3) Guia oficial de datos de personajes (Planeta Comic, manga impreso en Espana),
#      CBR en la biblioteca de Jellyfin; en particular el indice maestro de tecnicas
#      del tomo "03_Libro_de_combate" (= "Jin no sho", el ultimo publicado, con
#      indice acumulado de personajes y tecnicas de los 4 libros: 501 personajes,
#      544 tecnicas). Extraido por OCR el 2026-09-15 (ver
#      /buzon/Naruto/indice_tecnicas_planeta_raw.txt); es traduccion impresa real
#      de Espana, mas fiable que Wikipedia, pero es el manga, no el doblaje del
#      anime que se esta subtitulando aqui, asi que no gana a un subtitulo
#      real del anime en castellano si ambos existen para el mismo termino.
#   4) Wikipedia ES: articulo "Naruto" y anexos "Ninjutsu (Naruto) A-G / H-Z"
#      (fuente secundaria fiable, pero NO es el manga/doblaje oficial en sí;
#      tratar como referencia, no como prueba de fidelidad 1:1 al doblaje/manga)
#   5) Convencion establecida en el propio proyecto (ej. Rasengan/Chidori sin traducir,
#      indicado explicitamente por Christian)
#
# La mayoria de "spanish_es" sigue viniendo de Wikipedia ES (verified: false) salvo
# donde se indica lo contrario. El indice maestro de tecnicas de la guia oficial
# confirmo/corrigio un primer lote de entradas el 2026-09-15 (ver notas individuales
# en "source"), pero con 544 tecnicas en el indice y solo unas pocas docenas de
# entradas en este glosario, quedan muchas por cruzar; tratar el manga como fuente
# de consulta puntual (buscar el termino concreto cuando haga falta), no como un
# pase exhaustivo ya terminado.
#
# verified: true  -> confirmado en fuente oficial, en dialogo real del anime
#                     en castellano, o es una convencion de no-traduccion ya
#                     establecida y confirmada por el propio proyecto.
# verified: false -> mejor traduccion disponible a partir de Wikipedia ES o de
#                     convencion general de doblajes de anime; NO confirmado
#                     contra el manga/doblaje real de Espana. Revisar si aparece
#                     dialogo real que lo contradiga.

